<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Noctifa</title>
    <!-- Import Google Fonts for Royal/Fantasy vibe -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Link to custom standalone CSS theme file -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <!-- Star background container -->
    <div class="stars"></div>

    <div class="site-wrapper">
<header>
            <div style="max-width: 90px; margin: 0 auto 0.75rem auto;">
                <img src="{{ '/assets/images/images_site_roundlogo.webp' | relative_url }}" alt="Noctifa Logo" style="width: 100%; border-radius: 50%; border: 1px solid var(--border-color); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);">
            </div>
            <h1>Noctifa</h1>
            <p>The Enchanting Crossover Ship of Noctis Lucis Caelum & Tifa Lockhart</p>
            <nav>
                <a href="{{ '/' | relative_url }}">Home</a>
                <!-- Change 'compat/' below if your file is named compat.html -->
                <a href="{{ '/compat/' | relative_url }}">Compatibility</a>
                <a href="{{ '/fan-art/' | relative_url }}">Fan Art & Fiction</a>
            </nav>
        </header>

        <main>
            {{ content }}
        </main>

        <footer>
            <p>&copy; {{ 'now' | date: "%Y" }} Noctifa.com. Under One Night Sky.</p>
        </footer>
    </div>
</body>
</html>
